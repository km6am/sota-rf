# SOTA RF WFS — reverse-proxy to the local waitress app.
# Add this location block inside the existing km6am.com (443 ssl) server block,
# e.g. via `include /opt/sota-rf/deploy/droplet/nginx-rf.conf;`. CalTopo then
# reaches the WFS at https://km6am.com/geoserver/wfs — no ngrok needed.
# (The report cards under /rf/ are plain static files in the web docroot and
#  need no proxy config.)
location /geoserver/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
}
